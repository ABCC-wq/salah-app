name: Build APK

# Runs on every push to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    # Pinned rather than ubuntu-latest, so an OS upgrade on GitHub's side
    # can't break the build without warning.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # Capacitor 8 requires Node >= 22
          cache: 'npm'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      # The native android/ folder is generated here rather than committed,
      # so the repo stays small and always matches the Capacitor version.
      - name: Generate Android project
        run: npx cap add android

      # The signing key lives in repo secrets, never in the repo itself.
      # Fail loudly without it: an APK signed with a throwaway key can't
      # update the installed app.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD secrets (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/salah.keystore

      - name: Apply native tweaks
        run: python3 patch-android.py

      - name: Generate icons and splash screens
        run: npx @capacitor/assets generate --android

      - name: Copy web assets
        run: npx cap sync android

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: salah-counter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
