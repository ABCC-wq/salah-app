name: Build APK

# Runs on every push to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 requires Node >= 22
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      # The native android/ folder is generated here rather than committed,
      # so the repo stays small and always matches the Capacitor version.
      - name: Generate Android project
        run: npx cap add android

      - name: Apply native tweaks
        run: python3 patch-android.py

      - name: Generate icons and splash screens
        run: npx @capacitor/assets generate --android

      - name: Copy web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: salah-counter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
